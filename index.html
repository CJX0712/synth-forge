<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SynthForge · 合成锻造炉</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --txt:#e6edf3;
    --muted:#8b949e; --accent:#58a6ff; --live:#3fb950; --dead:#0d1117;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;}
  .wrap{max-width:1040px;margin:0 auto;padding:20px;}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:.5px;}
  h1 .v{color:var(--accent);}
  .sub{color:var(--muted);font-size:12px;margin-bottom:16px;}
  .layout{display:grid;grid-template-columns:1fr 280px;gap:16px;}
  @media(max-width:820px){.layout{grid-template-columns:1fr;}}
  .stage{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;}
  canvas{display:block;width:100%;height:auto;background:#05060a;border:1px solid var(--border);border-radius:4px;}
  .side{display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;}
  .card h2{font-size:12px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  button{background:#21262d;color:var(--txt);border:1px solid var(--border);border-radius:6px;
    padding:7px 10px;font-size:12px;cursor:pointer;font-family:inherit;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:600;}
  input[type=text]{width:100%;background:#0d1117;color:var(--txt);border:1px solid var(--border);
    border-radius:6px;padding:7px 9px;font-size:12px;font-family:inherit;}
  label{font-size:11px;color:var(--muted);display:block;margin:8px 0 4px;}
  .wave{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .wave button{padding:6px 4px;font-size:11px;}
  .wave button.on{border-color:var(--live);color:var(--live);}
  .stats{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--border);}
  .stats:last-child{border-bottom:none;}
  .stats b{color:var(--accent);}
  .self{font-size:11px;line-height:1.7;}
  .self .ok{color:var(--live);}
  .self .bad{color:#f85149;}
  .hint{font-size:11px;color:var(--muted);line-height:1.6;}
  .adsr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .adsr div{font-size:11px;color:var(--muted);}
  .adsr input[type=range]{width:100%;}
</style>
</head>
<body>
<div class="wrap">
  <h1>SynthForge <span class="v">·</span> 合成锻造炉</h1>
  <div class="sub">单文件离线合成器 · 4 种波形 + ADSR 包络 + 确定性旋律种子 — <a href="https://github.com/CJX0712/synth-forge" style="color:var(--accent)">github.com/CJX0712/synth-forge</a></div>

  <div class="layout">
    <div class="stage">
      <canvas id="cv" width="640" height="240"></canvas>
      <div class="row" style="margin-top:12px;">
        <button id="play" class="primary">▶ 播放旋律</button>
        <button id="note" class="warn">▶ 试听单音</button>
      </div>
      <label>采样率 8000 Hz · 画布显示整段旋律波形</label>
    </div>

    <div class="side">
      <div class="card">
        <h2>波形</h2>
        <div class="wave" id="waves">
          <button data-w="sine" class="on">正弦</button>
          <button data-w="square">方波</button>
          <button data-w="saw">锯齿</button>
          <button data-w="triangle">三角</button>
        </div>
      </div>

      <div class="card">
        <h2>ADSR 包络</h2>
        <div class="adsr">
          <div>Attack<input id="a" type="range" min="1" max="200" value="10"></div>
          <div>Decay<input id="d" type="range" min="1" max="300" value="50"></div>
          <div>Sustain<input id="s" type="range" min="0" max="100" value="70"></div>
          <div>Release<input id="r" type="range" min="1" max="300" value="80"></div>
        </div>
        <div class="hint" style="margin-top:6px;">单位：Attack/Decay/Release 为毫秒，Sustain 为 0–1 电平。</div>
      </div>

      <div class="card">
        <h2>确定性种子</h2>
        <div style="display:flex;gap:6px;">
          <input id="seed" type="text" placeholder="任意文字/数字" value="晨星">
        </div>
        <label>音符数 <span id="nLabel">12</span></label>
        <input id="nn" type="range" min="2" max="32" value="12">
        <div class="row" style="margin-top:8px;">
          <button id="applyseed">用种子生成</button>
        </div>
        <div class="hint" style="margin-top:6px;">同种子 + 同数量 = 同一旋律。A4=440Hz，MIDI 36–84。</div>
      </div>

      <div class="card">
        <h2>内置自检</h2>
        <div class="self" id="selfcheck">点击「运行自检」验证波形与包络正确性。</div>
        <div class="row" style="margin-top:8px;">
          <button id="selftest">运行自检</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script id="engine">
// ===== SynthForge engine (pure, headless-extractable) =====
const Synth = (function(){
  // phase in [0,1): one full period
  function osc(type, phase){
    phase = phase - Math.floor(phase);
    switch (type){
      case 'sine':    return Math.sin(2 * Math.PI * phase);
      case 'square':  return Math.sin(2 * Math.PI * phase) >= 0 ? 1 : -1;
      case 'saw':     return 2 * phase - 1;
      case 'triangle':return phase < 0.5 ? (4 * phase - 1) : (3 - 4 * phase);
      default:        return Math.sin(2 * Math.PI * phase);
    }
  }
  function noteFreq(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }

  // render one note: Float32 samples with ADSR envelope. adsr = {a,d,s,r} in seconds
  function renderNote(type, freq, dur, sr, adsr){
    sr = sr || 8000;
    const n = Math.max(1, Math.round(dur * sr));
    const out = new Float32Array(n);
    const a = adsr.a, d = adsr.d, s = adsr.s, r = adsr.r;
    for (let i = 0; i < n; i++){
      const t = i / sr;
      let env;
      if (t < a) env = a > 0 ? t / a : 1;
      else if (t < a + d) env = 1 - (1 - s) * ((t - a) / d);
      else if (t < dur - r) env = s;
      else env = Math.max(0, s * (1 - (t - (dur - r)) / r));
      const phase = (i * freq / sr) % 1;
      out[i] = osc(type, phase) * env;
    }
    return out;
  }

  // render a sequence of notes back to back
  function renderMelody(type, notes, sr, adsr){
    sr = sr || 8000;
    let total = 0;
    for (const nt of notes) total += Math.round(nt.dur * sr);
    const out = new Float32Array(total);
    let off = 0;
    for (const nt of notes){
      const part = renderNote(type, noteFreq(nt.midi), nt.dur, sr, adsr);
      out.set(part, off); off += part.length;
    }
    return out;
  }

  function melodyFromSeed(seedStr, n){
    n = n || 12;
    let st = 0; const str = String(seedStr);
    for (let i = 0; i < str.length; i++) st = (st * 31 + str.charCodeAt(i)) >>> 0;
    st = st || 0x9e3779b9;
    const rnd = () => { st = (st * 1664525 + 1013904223) >>> 0; return st / 4294967296; };
    const arr = [];
    for (let i = 0; i < n; i++){
      const midi = 36 + Math.floor(rnd() * (84 - 36 + 1)); // C2..C6-ish
      const dur = 0.15 + rnd() * 0.35;
      arr.push({ midi, dur });
    }
    return arr;
  }

  return { osc, noteFreq, renderNote, renderMelody, melodyFromSeed };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = Synth;
</script>

<script>
// ===== UI =====
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  let waveform = 'sine';

  function adsr(){
    return {
      a: (+document.getElementById('a').value) / 1000,
      d: (+document.getElementById('d').value) / 1000,
      s: (+document.getElementById('s').value) / 100,
      r: (+document.getElementById('r').value) / 1000
    };
  }
  function currentNotes(){
    const n = +document.getElementById('nn').value;
    const seed = document.getElementById('seed').value || '晨星';
    return Synth.melodyFromSeed(seed, n);
  }

  function drawWave(){
    const notes = currentNotes();
    const data = Synth.renderMelody(waveform, notes, 8000, adsr());
    ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 1; ctx.beginPath();
    const mid = H / 2;
    const step = Math.max(1, Math.floor(data.length / W));
    let first = true;
    for (let x = 0; x < W; x++){
      const idx = Math.min(data.length - 1, x * step);
      const y = mid - data[idx] * (mid - 4);
      if (first){ ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
    document.getElementById('nLabel').textContent = notes.length;
  }

  let actx = null;
  function playMelody(){
    const notes = currentNotes();
    const A = adsr();
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch(e){ alert('此环境不支持 WebAudio 播放（无头/不支持），但波形与自检仍可用。'); return; }
    let t0 = actx.currentTime + 0.05;
    for (const nt of notes){
      const freq = Synth.noteFreq(nt.midi);
      const o = actx.createOscillator(); o.type = waveform; o.frequency.value = freq;
      const g = actx.createGain();
      const dur = nt.dur;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(1, t0 + A.a);
      g.gain.linearRampToValueAtTime(A.s, t0 + A.a + A.d);
      g.gain.setValueAtTime(A.s, t0 + Math.max(A.a + A.d, dur - A.r));
      g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
      t0 += dur;
    }
  }
  function playNote(){
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch(e){ return; }
    const A = adsr();
    const o = actx.createOscillator(); o.type = waveform; o.frequency.value = 440;
    const g = actx.createGain();
    const dur = 0.6;
    const t0 = actx.currentTime + 0.02;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(1, t0 + A.a);
    g.gain.linearRampToValueAtTime(A.s, t0 + A.a + A.d);
    g.gain.setValueAtTime(A.s, t0 + Math.max(A.a + A.d, dur - A.r));
    g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  document.getElementById('play').onclick = playMelody;
  document.getElementById('note').onclick = playNote;
  document.getElementById('applyseed').onclick = drawWave;
  document.getElementById('nn').oninput = e => { document.getElementById('nLabel').textContent = e.target.value; drawWave(); };
  ['a','d','s','r'].forEach(id => document.getElementById(id).oninput = drawWave);
  document.querySelectorAll('#waves button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#waves button').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); waveform = b.dataset.w; drawWave();
    };
  });

  document.getElementById('selftest').onclick = () => {
    const out = [];
    const T = (name, cond) => out.push((cond ? '<span class="ok">✓</span> ' : '<span class="bad">✗</span> ') + name);
    // sine key points
    T('正弦: osc(0)=0', Math.abs(Synth.osc('sine', 0)) < 1e-12);
    T('正弦: osc(0.25)=1', Math.abs(Synth.osc('sine', 0.25) - 1) < 1e-12);
    T('正弦: osc(0.5)=0', Math.abs(Synth.osc('sine', 0.5)) < 1e-12);
    T('正弦: osc(0.75)=-1', Math.abs(Synth.osc('sine', 0.75) + 1) < 1e-12);
    // square sign
    T('方波: 正相位=1', Synth.osc('square', 0.1) === 1);
    T('方波: 负相位=-1', Synth.osc('square', 0.6) === -1);
    // saw / triangle range
    let sawOk = true, triOk = true;
    for (let p = 0; p < 1; p += 0.01){ if (Math.abs(Synth.osc('saw', p)) > 1.0001) sawOk = false; if (Math.abs(Synth.osc('triangle', p)) > 1.0001) triOk = false; }
    T('锯齿/三角: 值域 [-1,1]', sawOk && triOk);
    // renderNote length
    const rn = Synth.renderNote('sine', 440, 0.1, 8000, {a:0.01,d:0.05,s:0.7,r:0.08});
    T('renderNote: 长度 = dur*sr', rn.length === Math.round(0.1 * 8000));
    // peak <= 1
    let peak = 0; for (const v of rn) peak = Math.max(peak, Math.abs(v));
    T('renderNote: 峰值 ≤ 1', peak <= 1.0001);
    // envelope start/end near 0
    T('renderNote: 起点≈0 (attack)', Math.abs(rn[0]) < 0.05);
    T('renderNote: 终点≈0 (release)', Math.abs(rn[rn.length - 1]) < 0.05);
    // frequency period: sine peaks ~every sr/freq samples
    const period = 8000 / 440;
    const halfP = Math.round(period / 4);
    T('renderNote: 相位 1/4 周期处≈峰值', Math.abs(rn[halfP] - oscAt('sine', halfP, 440, 8000)) < 0.05);
    // determinism
    const m1 = Synth.melodyFromSeed('晨星', 12), m2 = Synth.melodyFromSeed('晨星', 12);
    T('种子确定性：同种子同旋律', JSON.stringify(m1) === JSON.stringify(m2));
    const m3 = Synth.melodyFromSeed('别的', 12);
    T('种子区分：异种子异旋律', JSON.stringify(m1) !== JSON.stringify(m3));
    // note frequencies in audible-ish range
    let freqOk = true; for (const nt of m1){ const f = Synth.noteFreq(nt.midi); if (f < 50 || f > 3000) freqOk = false; }
    T('旋律频率在合理范围 (50–3000Hz)', freqOk);
    document.getElementById('selfcheck').innerHTML = out.join('<br>');
  };
  function oscAt(type, i, freq, sr){ return Synth.osc(type, (i * freq / sr) % 1); }

  drawWave();
})();
</script>
</body>
</html>
